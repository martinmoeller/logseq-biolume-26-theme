name: Build and Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create release package
        run: zip -j logseq-biolume-26-theme.zip package.json theme-light.css theme-dark.css icon.svg README.md LICENSE

      - name: Create release with package
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" logseq-biolume-26-theme.zip --title "Release $GITHUB_REF_NAME" --generate-notes
